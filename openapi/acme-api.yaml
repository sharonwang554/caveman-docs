openapi: 3.0.3
info:
  title: Acme Enterprise API
  description: The official Acme Enterprise API for user management and integration.
  version: 1.0.0
servers:
  - url: https://api.acme.com/v1
    description: Production server
paths:
  /users:
    get:
      summary: List all users
      operationId: listUsers
      responses:
        '200':
          description: A JSON array of user objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
    post:
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '201':
          description: Created user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - email
      properties:
        id:
          type: string
          example: 'usr_12345'
        name:
          type: string
          example: 'Jane Doe'
        email:
          type: string
          example: 'jane@acme.com'
    NewUser:
      type: object
      required:
        - name
        - email
      properties:
        name:
          type: string
          example: 'Jane Doe'
        email:
          type: string
          example: 'jane@acme.com'
